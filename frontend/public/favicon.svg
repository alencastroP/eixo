  <g fill="#FF6B35">
    <rect x="14" y="11" width="100" height="28" rx="6"/>
    <rect x="14" y="50" width="70" height="28" rx="6"/>
    <rect x="14" y="89" width="100" height="28" rx="6"/>
  </g>
</svg>
