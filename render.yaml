# Blueprint do Render - dois serviços a partir da mesma imagem Docker
# (backend/Dockerfile), cada um rodando um processo diferente do backend.
#
# Uso: no painel do Render, "New" → "Blueprint" → aponte para este repositório.
# Depois de aplicar, preencha no dashboard as env vars marcadas com `sync: false`
# (segredos externos: connection string do Neon, chave da Anthropic, tokens de
# webhook) - elas não ficam versionadas aqui.
#
# Compartilhamento de segredos entre os serviços: o eixo-crm-api é a fonte
# (gera/recebe os valores) e o eixo-crm-webhooks os puxa via `fromService`. Env var
# groups NÃO servem aqui porque o spec do Render proíbe `sync: false` e
# `generateValue` dentro de grupos - só aceitam valores literais.

services:
  # ─── API principal (autenticada) - FONTE dos segredos compartilhados ─────
  - type: web
    name: eixo-crm-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    # roda as migrations pendentes antes de subir o processo. `migrate deploy`
    # usa lock consultivo no Postgres - seguro mesmo se os dois serviços
    # reiniciarem ao mesmo tempo.
    # ATENÇÃO: sem aspas nem `&&` aqui. O Render quebra o dockerCommand em
    # tokens sem interpretar shell, então `sh -c "a && b"` faz o sh receber
    # `"a` como comando e sair com 127 (command not found). O encadeamento
    # (migrations + boot) mora no script npm `start:prod`, do backend.
    dockerCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Neon: connection string COM "-pooler" (runtime) e SEM "-pooler"
      # (migrations). Preencher no dashboard após aplicar o Blueprint.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Gerados uma vez pelo Render, aqui. O eixo-crm-webhooks puxa os MESMOS
      # valores via fromService - CREDENTIALS_SECRET precisa bater entre os
      # dois (cifra credenciais de integração no banco); JWT/pepper são
      # exigidos no boot dos dois processos (config/env.ts os lê sempre).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CREDENTIALS_SECRET
        generateValue: true
      - key: TRIAL_CPF_PEPPER
        generateValue: true
      # URLs públicas do frontend - libera CORS. Não é segredo, por isso vai
      # literal. Ao publicar as vitrines em subdomínio próprio, acrescente o
      # curinga do domínio (ex.: ",https://*.eixo.com.br"): cada loja é um host
      # diferente chamando esta mesma API.
      - key: CORS_ORIGIN
        value: https://eixo.pedrovalencastro.workers.dev
      # Host público desta própria API - usado para montar a URL absoluta das
      # imagens enviadas (logo/hero da vitrine, fotos de veículo). Front e API
      # vivem em domínios diferentes (Cloudflare Workers vs Render); sem isso
      # as imagens são salvas com URL relativa, que resolve contra o domínio
      # do front (onde não existem) em vez do domínio que as guarda.
      - key: API_PUBLIC_URL
        value: https://eixo-crm-api.onrender.com
      # Bucket das imagens enviadas (logo/hero da vitrine, fotos de veiculo).
      # OBRIGATORIO aqui: o plano free nao tem disco persistente, entao gravar
      # em /uploads funciona ate o proximo deploy e some depois dele.
      - key: R2_BUCKET
        value: eixo-uploads
      - key: R2_ENDPOINT
        value: https://3de4cc4eb2a7e9a7e2daeafe46ce77b6.r2.cloudflarestorage.com
      - key: R2_PUBLIC_URL
        value: https://pub-095f7f3764b9447a972b89d2509917ac.r2.dev
      # Credenciais do bucket - preencher no dashboard (nao versionadas).
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # A tela de Integrações exibe a URL de webhook de cada loja; precisa saber
      # o host do serviço de webhooks (que é outro serviço, outra URL).
      - key: WEBHOOK_PUBLIC_URL
        value: https://eixo-crm-webhooks.onrender.com
      - key: RATE_LIMIT_SITE_LEAD_PER_HOUR
        value: "15"
      - key: RATE_LIMIT_SITE_CHAT_PER_HOUR
        value: "60"
      # Consultas do widget por novas mensagens (por IP/MINUTO, não por hora):
      # é leitura indexada, sem custo de modelo. Teto baixo aqui faria a
      # resposta do atendente parar de chegar no meio da conversa.
      - key: RATE_LIMIT_SITE_CHAT_POLL_PER_MIN
        value: "60"
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "7"
      # Sem esta chave, o Co-Piloto de IA fica indisponível (atendimento
      # segue 100% humano) - não é bloqueante para o deploy.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_MAX_TOOL_ITERATIONS
        value: "4"
      - key: ANTHROPIC_MAX_TOKENS
        value: "1024"
      - key: RATE_LIMIT_GLOBAL_PER_MIN
        value: "300"
      - key: RATE_LIMIT_AUTH_PER_15MIN
        value: "20"
      - key: RATE_LIMIT_TRIAL_PER_HOUR
        value: "5"
      - key: DEDUP_WINDOW_HOURS
        value: "72"
      - key: SLA_FIRST_RESPONSE_MINUTES
        value: "30"
      - key: RETENTION_WEBHOOK_EVENT_DAYS
        value: "90"
      - key: RETENTION_CREDIT_QUERY_DAYS
        value: "365"
      - key: RETENTION_AUDIT_LOG_DAYS
        value: "730"

  # ─── Recepção de webhooks + worker de leads (processo independente) ────
  - type: web
    name: eixo-crm-webhooks
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    dockerCommand: node dist/webhook-server.js
    envVars:
      - key: NODE_ENV
        value: production
      # o Render roteia tráfego pela var PORT (senão assume 10000); o app só
      # abre a porta lida em WEBHOOK_PORT - as duas precisam apontar pro
      # mesmo valor para o roteamento bater com onde o processo escuta.
      - key: PORT
        value: "3002"
      - key: WEBHOOK_PORT
        value: "3002"
      # puxa os MESMOS valores gerados/definidos no eixo-crm-api (não precisa
      # redigitar nada no dashboard). O webhook-server não roda migrations,
      # então DIRECT_URL é desnecessário aqui.
      - key: DATABASE_URL
        fromService:
          name: eixo-crm-api
          type: web
          envVarKey: DATABASE_URL
      - key: JWT_ACCESS_SECRET
        fromService:
          name: eixo-crm-api
          type: web
          envVarKey: JWT_ACCESS_SECRET
      - key: CREDENTIALS_SECRET
        fromService:
          name: eixo-crm-api
          type: web
          envVarKey: CREDENTIALS_SECRET
      - key: TRIAL_CPF_PEPPER
        fromService:
          name: eixo-crm-api
          type: web
          envVarKey: TRIAL_CPF_PEPPER
      # worker embutido no mesmo processo (mantém 1 serviço em vez de 2 no
      # plano free). Se crescer o volume, separar em eixo-worker próprio.
      - key: WORKER_INLINE
        value: "true"
      - key: WORKER_POLL_INTERVAL_MS
        value: "2000"
      - key: WORKER_BATCH_SIZE
        value: "20"
      - key: WORKER_MAX_ATTEMPTS
        value: "5"
      - key: WORKER_RETRY_DELAY_MS
        value: "30000"
      - key: RATE_LIMIT_WEBHOOK_PER_MIN
        value: "120"
      # Não há mais token de plataforma aqui: cada conta tem o próprio segredo
      # de webhook, gerado no CRM ao conectar a integração e guardado cifrado
      # no banco (integrations.inboundSecret). Um segredo único no ambiente
      # significava que qualquer lojista podia forjar lead no funil de outro.
      #
      # Host público deste serviço - usado só para montar a URL que o lojista
      # cola no painel da plataforma. Deve bater com a URL real do serviço.
      - key: WEBHOOK_PUBLIC_URL
        value: https://eixo-crm-webhooks.onrender.com
